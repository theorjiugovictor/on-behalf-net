<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <title>On Behalf</title>

  <!-- Obsidian Container -->
  <rect width="64" height="64" rx="14" fill="#09090B" />

  <!-- Two Intersecting Mandate Circles -->
  <circle cx="25" cy="32" r="14" stroke="#FFFFFF" stroke-width="4.5" />
  <circle cx="39" cy="32" r="14" stroke="#FFFFFF" stroke-width="4.5" />

  <!-- Converged Overlap Lens -->
  <path
    d="M 32 19.88 A 14 14 0 0 1 32 44.12 A 14 14 0 0 1 32 19.88 Z"
    fill="#FFFFFF"
  />
</svg>

